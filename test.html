<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
  body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    flex-direction: row;
  }
  .slide {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    background: #050505;
    box-sizing: border-box;
    border-right: 2px solid #222; /* just for visual separation in test */
  }
  /* Header */
  .header-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 600px;
    background: linear-gradient(135deg, #18181b 0%, #09090b 100%); /* Deep zinc to black */
    border-bottom: 1px solid rgba(245, 158, 11, 0.2); /* Gold accent line */
    clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
    z-index: 1;
  }
  .header-dots {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(rgba(245, 158, 11, 0.15) 2px, transparent 2px); /* Gold dots */
    background-size: 40px 40px;
    z-index: 2;
  }
  .header-content {
    position: absolute;
    top: 120px;
    width: 100%;
    text-align: center;
    z-index: 3;
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #F59E0B; /* Gold text */
    text-transform: uppercase;
    text-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
  }

  /* Content Area */
  .content {
    position: absolute;
    top: 600px;
    width: 100%;
    padding: 0 80px;
    box-sizing: border-box;
    z-index: 4;
  }

  /* Glass Box */
  .glass-box {
    background: rgba(24, 24, 27, 0.7); /* Zinc 900 mostly transparent */
    border: 1px solid rgba(245, 158, 11, 0.3); /* Gold border */
    border-radius: 24px;
    padding: 60px;
    margin-bottom: 40px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(245, 158, 11, 0.05);
    position: relative;
    backdrop-filter: blur(16px);
  }

  .box-label {
    color: #FBBF24;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  .box-text {
    font-size: 48px;
    font-weight: 600;
    line-height: 1.4;
    color: #e4e4e7;
  }

  .box-text.gold {
    color: #F59E0B;
  }

  .down-arrow {
    text-align: center;
    color: #F59E0B;
    font-size: 48px;
    margin: -10px 0 30px 0;
  }

  /* Footer Pagination */
  .footer {
    position: absolute;
    bottom: 80px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 80px;
    box-sizing: border-box;
    z-index: 4;
  }

  .footer-product {
    color: rgba(245, 158, 11, 0.4);
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .pagination {
    display: flex;
    gap: 16px;
  }
  .dot {
    width: 48px;
    height: 6px;
    background: rgba(245, 158, 11, 0.2);
    border-radius: 3px;
  }
  .dot.active {
    background: #F59E0B;
    box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
  }

  /* Slide 3 specific */
  .s3-header {
    text-align: center;
    margin-top: 120px;
    z-index: 4;
    position: relative;
  }
  .s3-verified {
    color: rgba(245, 158, 11, 0.8);
    font-size: 28px;
    letter-spacing: 8px;
    margin-bottom: 16px;
  }
  .s3-title {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.2);
  }
  .product-showcase {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 800px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 3;
  }
  .product-glow {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.4) 0%, transparent 70%);
    opacity: 0.8;
    z-index: 1;
  }
  .product-image {
    position: relative;
    z-index: 4;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.9));
  }
  .s3-cta {
    position: absolute;
    bottom: 240px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #F59E0B, #FBBF24);
    color: #000;
    font-size: 40px;
    font-weight: 800;
    padding: 32px 80px;
    border-radius: 80px;
    text-transform: uppercase;
    z-index: 5;
    box-shadow: 0 10px 40px rgba(245, 158, 11, 0.4);
    white-space: nowrap;
  }
  .s3-footer {
    position: absolute;
    bottom: 80px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 28px;
    letter-spacing: 4px;
  }

  /* Corner Brackets for Slide 3 */
  .bracket {
    position: absolute;
    width: 60px;
    height: 60px;
    border-color: #F59E0B;
    border-style: solid;
    z-index: 10;
    opacity: 0.6;
  }
  .tl { top: 60px; left: 60px; border-width: 4px 0 0 4px; }
  .tr { top: 60px; right: 60px; border-width: 4px 4px 0 0; }
  .bl { bottom: 60px; left: 60px; border-width: 0 0 4px 4px; }
  .br { bottom: 60px; right: 60px; border-width: 0 4px 4px 0; }

</style>
</head>
